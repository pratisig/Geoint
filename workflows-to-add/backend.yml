name: Backend CI & Docker

on:
  push:
    branches: [ main, arena/01a0a4ee-geoint, arena/01a0a621-geoint ]
    paths:
      - 'main.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Syntax check
        run: |
          python -m py_compile main.py
          python -c "import main; print(f'RSS: {len(main.RSS_FEEDS)} Dorks: {len(main.DORKS_DATABASE)} Engines: {len(main.OSINT_ENGINES)}')"

      - name: Run FastAPI health check
        run: |
          timeout 30 uvicorn main:app --host 0.0.0.0 --port 8001 &
          PID=$!
          sleep 8
          curl -s http://localhost:8001/api/health | tee health.json
          cat health.json | grep -q "V4"
          curl -s http://localhost:8001/api/dorks/all | head -c 500
          curl -s http://localhost:8001/api/osint/engines | head -c 500
          curl -s http://localhost:8001/api/osint/reverse-image/engines | head -c 500
          kill $PID || true

  docker-build:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: human-osint-v4:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
