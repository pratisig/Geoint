name: Backend CI & Docker - FIXED

on:
  push:
    branches: [ main, arena/01a0a4ee-geoint ]
    paths:
      - 'main.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Syntax check
        run: |
          python -m py_compile main.py
          python -c "import main; print(f'RSS: {len(main.RSS_FEEDS)} Dorks: {len(main.DORKS_DATABASE)} Hotspots: {len(main.GEO_HOTSPOTS)}')"

      - name: Run FastAPI health check - FIXED (fast startup, retry 60s)
        run: |
          set +e
          echo "Starting uvicorn..."
          uvicorn main:app --host 0.0.0.0 --port 8001 > uvicorn.log 2>&1 &
          PID=$!
          echo "PID=$PID"
          
          SUCCESS=0
          for i in {1..30}; do
            sleep 2
            HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" http://localhost:8001/api/health || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              if grep -q "ULTIMATE\|status\|version" /tmp/health.json; then
                echo "✅ Backend ready after $((i*2))s - HTTP $HTTP_CODE"
                cat /tmp/health.json
                SUCCESS=1
                break
              fi
            fi
            echo "Waiting... $i/30 - HTTP $HTTP_CODE"
            if [ $((i % 5)) -eq 0 ]; then
              echo "--- uvicorn.log tail ---"
              tail -n 30 uvicorn.log || true
            fi
          done
          
          echo "=== uvicorn.log full ==="
          cat uvicorn.log | tail -n 150
          echo "========================"
          
          echo "=== /api/health ==="
          cat /tmp/health.json 2>/dev/null || echo "no health.json"
          echo ""
          
          echo "=== /api/dorks/all ==="
          curl -s http://localhost:8001/api/dorks/all?limit=2 | head -c 1000 || true
          echo ""
          
          echo "=== /api/feeds/live ==="
          curl -s http://localhost:8001/api/feeds/live?limit=2 | head -c 1000 || true
          echo ""
          
          kill $PID || true
          sleep 2
          kill -9 $PID || true
          
          if [ $SUCCESS -eq 1 ]; then
            echo "✅ Health check PASSED"
            exit 0
          else
            echo "❌ Health check FAILED"
            cat uvicorn.log
            exit 1
          fi

  docker-build:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: human-osint-ultimate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
