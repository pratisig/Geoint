name: Android APK Build - FIXED

on:
  push:
    branches: [ main, arena/01a0a4ee-geoint ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK - Manual FIX (no obsolete tools)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lh $ANDROID_HOME/cmdline-tools/ || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating gradle wrapper 9.3.1"
            wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/
            /tmp/gradle-9.3.1/bin/gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew
          ls -lh gradlew gradle/wrapper/

      - name: Create debug keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore || true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HUMAN-OSINT-ULTIMATE-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: List APKs
        run: find app/build/outputs -name "*.apk" -type f -exec ls -lh {} \;
