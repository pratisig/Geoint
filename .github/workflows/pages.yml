name: Deploy Web to GitHub Pages - FIXED v2

on:
  push:
    branches: [ main, arena/01a0a4ee-geoint ]
    paths:
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages - FIXED v4 (v5 bug TypeError)
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp index.html _site/404.html || true
          echo "Site ready:"
          ls -lh _site/
          echo "Size: $(du -h _site/index.html)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
