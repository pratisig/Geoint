name: Deploy Web to GitHub Pages - FIXED

on:
  push:
    branches: [ main, arena/01a0a4ee-geoint ]
    paths:
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages - FIXED with enablement
        uses: actions/configure-pages@v5
        with:
          enablement: true
          static_site_generator: static

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          # Optional: add 404 page for SPA routing
          cp index.html _site/404.html || true
          ls -lh _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
