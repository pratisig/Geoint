# Render Blueprint - HUMAN-OSINT v4.2
# https://render.com/docs/blueprint-spec
#
# IMPORTANT: keep numInstances at 1. The auto-update engine keeps the scraped
# feed in process memory (live_cache) and pushes changes over SSE. With several
# instances each would hold its own cache and a client connected to one
# instance would never see the updates produced by another.

# The event archive is what makes the HISTORY tab useful. Render's free web
# service has an EPHEMERAL filesystem and cannot attach a persistent disk, so a
# local SQLite file is wiped on every spin-down and every redeploy. Attaching a
# database is the only way past events survive.
#
# Note on the free tier: Render's free PostgreSQL EXPIRES 30 days after
# creation, then has a 14-day grace period before deletion. It is fine for
# evaluation. For durable history, use a paid instance (the persistent disk is
# $0.25/GB/month from the $7/mo Starter tier) or export to GeoJSON regularly.
#
# If the database ever goes away, the app still boots: storage.connect() logs
# the failure and downgrades the process to SQLite for that instance.
databases:
  - name: human-osint-db
    plan: free
    databaseName: osint
    user: osint
    # Keep the schema aligned with storage.init_schema(), which is idempotent.
    postgresMajorVersion: "16"

services:
  - type: web
    name: human-osint-v4-power
    env: python
    plan: free
    # Redeploy automatically on every push to main.
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # One worker only: the feed cache and the SSE stream are in-process state.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    # Render waits for this to answer 200 before routing traffic, which also
    # means the first user never lands on an empty feed after a cold start.
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: 1
      # Re-scrape every source every 60 s (seconds).
      - key: OSINT_REFRESH_INTERVAL
        value: "60"
      # Random spread so concurrent workers do not hit upstreams together.
      - key: OSINT_REFRESH_JITTER
        value: "10"
      # SSE keep-alive period; must stay below the idle timeout of any proxy.
      - key: OSINT_SSE_HEARTBEAT
        value: "15"
      - key: OSINT_MAX_CACHE
        value: "300"
      # Wired to the database declared above. storage.py selects PostgreSQL as
      # soon as this starts with postgres:// or postgresql://.
      - key: DATABASE_URL
        fromDatabase:
          name: human-osint-db
          property: connectionString
      # Keep archived events for a year before prune() drops them.
      - key: OSINT_RETENTION_DAYS
        value: "365"
